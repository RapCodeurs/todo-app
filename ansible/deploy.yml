---
- name: Deploy To-Do Application to AWS EC2
  hosts: all
  become: yes

  tasks:
    - name: Ensure Docker is installed
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Ensure Docker Compose is installed
      apt:
        name: docker-compose-v2
        state: present

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create application directory
      file:
        path: /home/ubuntu/todo-app
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy docker-compose production file
      copy:
        src: ../docker-compose.prod.yml
        dest: /home/ubuntu/todo-app/docker-compose.yml
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Pull latest images and start containers
      community.docker.docker_compose_v2:
        project_src: /home/ubuntu/todo-app
        state: present
        pull: always
